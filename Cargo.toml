[package]
name = "four_wide_bot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "four_wide_bot"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "triangle-adapter"
path = "src/triangle_adapter.rs"

[[bin]]
name = "battle-gui"
path = "src/battle_main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:egui_plot"]

[dependencies]
eframe = { version = "0.27", features = ["persistence"], optional = true }
egui = { version = "0.27", optional = true }
egui_plot = { version = "0.27", optional = true }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

