[package]
name = "four_wide_bot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "four_wide_bot"
path = "src/main.rs"

[[bin]]
name = "triangle-adapter"
path = "src/triangle_adapter.rs"

[[bin]]
name = "battle-gui"
path = "src/battle_main.rs"

[dependencies]
eframe = { version = "0.27", features = ["persistence"] }
egui = "0.27"
egui_plot = "0.27"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

